
name: Pipeline de Integração Contínua

on:
  push:
    branches:
      - main
      - revisao-tecnica-mvp
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: Compilação e testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preparar Maven
        run: chmod +x mvnw

      - name: Executar compilação e testes
        run: ./mvnw clean verify
